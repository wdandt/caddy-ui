services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddyui-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/logs
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      CADDY_ADMIN: ${CADDY_ADMIN:-127.0.0.1:2019}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      TLS_EMAIL: ${TLS_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - sh
      - -c
      - |
        mkdir -p /config/caddy
        if [ ! -f /config/caddy/autosave.json ] || [ "$$(cat /config/caddy/autosave.json)" = "{}" ] || [ "$$(cat /config/caddy/autosave.json)" = "" ]; then
          echo "Adapting initial Caddyfile..."
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /config/caddy/autosave.json
        fi
        exec caddy run --config /config/caddy/autosave.json --resume --adapter json
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs: